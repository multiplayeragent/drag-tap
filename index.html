<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drag Tap</title>
<style>
  :root { --ink: #f4f1ff; --dim: #a9a3cc; --gold: #ffd23f; --go: #3dff8a; --bad: #ff3b6b; --cyan: #3df2ff; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #0b0a1c; }
  body { color: var(--ink); font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; height: 100dvh; touch-action: none; cursor: pointer; }
  [hidden] { display: none !important; }
  .hud { position: fixed; pointer-events: none; text-shadow: 0 1px 3px #000c; }
  #status { top: max(8px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-weight: 800; font-size: 15px; letter-spacing: .03em; }
  #hint { left: 12px; right: 12px; text-align: center; font-weight: 700; font-size: 14px; color: var(--gold); }
  #net { bottom: max(8px, env(safe-area-inset-bottom)); left: max(12px, env(safe-area-inset-left)); font-size: 12px; color: var(--dim); }
  .touch #net { bottom: calc(max(14px, env(safe-area-inset-bottom)) + 86px); }
  #sa { position: fixed; left: 0; bottom: 0; width: 0; height: env(safe-area-inset-bottom, 0px); pointer-events: none; }
  #act { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); width: min(92vw, 440px); height: 74px; transform: translateX(-50%);
         border: 0; border-radius: 20px; background: linear-gradient(#5dffa0, #18b860); color: #04220f; font: 900 26px system-ui, sans-serif; letter-spacing: .1em;
         box-shadow: 0 6px 0 #0a5a2e, 0 0 28px #3dff8a44; touch-action: none; -webkit-tap-highlight-color: transparent; }
  #act.down { transform: translateX(-50%) translateY(4px); box-shadow: 0 2px 0 #0a5a2e; }
  #act.wait { background: linear-gradient(#ffe27a, #e0a800); color: #3a2a00; box-shadow: 0 6px 0 #7a5a00; }
  #over { position: fixed; inset: 0; display: grid; place-items: center; background: #0b0a1cb0; }
  .card { box-sizing: border-box; width: min(400px, 92vw); max-height: 86vh; overflow: auto; padding: 18px 20px; border-radius: 16px; background: #1a1838; border: 1px solid #ffffff2a; text-align: center; box-shadow: 0 0 40px #ff3b6b33; }
  .card h2 { margin: 0 0 8px; font-size: 26px; }
  .card h3 { margin: 14px 0 4px; font-size: 14px; color: var(--gold); text-align: left; }
  .card ol { margin: 0; padding-left: 24px; font-size: 14px; text-align: left; }
  .card li { padding: 2px 0; }
  .card li span { float: right; font-variant-numeric: tabular-nums; }
  .card li small { display: block; color: var(--dim); font-size: 12px; }
  .card li.me { color: var(--gold); font-weight: 700; }
  .card p { margin: 10px 0 0; font-size: 13px; opacity: .8; }
  button.go { width: 100%; min-height: 48px; margin-top: 14px; border: 0; border-radius: 12px; background: var(--go); color: #04220f; font: 800 17px system-ui, sans-serif; cursor: pointer; }
</style>
<script src="https://cdn.multiplayeragent.com/sdk/mp.global.js"></script>
</head>
<body>
<canvas id="game"></canvas>
<div class="hud" id="status"></div>
<div class="hud" id="hint"></div>
<div class="hud" id="net">Connecting…</div>
<div id="sa"></div>
<button id="act" hidden>LAUNCH</button>
<div id="over" hidden><div class="card">
  <h2 id="winner"></h2><ol id="results"></ol>
  <h3>Fastest times</h3><ol id="board"><li>Loading…</li></ol>
  <button class="go" id="again">Play again</button><p id="next"></p>
</div></div>
<script>
/* ═══ DRAG TAP · a Multiplayer Agent starter ═══════════════════════════════════════════
 * 10-second drag races: launch on green, shift in the green zone. Versus, 2–6 players;
 * bots fill the empty lanes.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ race timing, the gearbox and engine, the shift zone, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   CAR ........... the physics every car shares (yours and the bots'): gears, limiter, perfect shifts
 *   RACE (HOST) ... the phases (stage, race, done), the lanes, the results, the bots.
 *                   Only the host writes these.
 *   MY CAR ........ launching, shifting, sending my car. Each player writes only its own.
 *   DRAW .......... the strip (sky, stands, lanes), the cars, the light tree, the dashboard
 *   HUD & RESULTS . status line, hints, results card, leaderboard, sounds
 *   INPUT ......... one button: Space / click / tap (launch, then shift)
 *
 * HOW THE MULTIPLAYER WORKS (a relay room: no server code):
 *   - The race lives in ONE shared field, `race`: {id, v, phase, greenAt, endsAt, lanes, res}.
 *     Only the HOST writes it; `v` goes up on every write. greenAt is a timestamp: every
 *     client lights its tree from it, so everyone gets green together.
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It stages each race, fixes the lanes at green, ends the race
 *     when every car is home (or time runs out) and writes the results. It also drives the
 *     bots and writes them to `bots` ~10 times a second. A new host adopts both and carries on.
 *   - Each player drives its OWN car and writes `d` {r, x, v, g, f, rt, rl, p} (race id, meters,
 *     speed, gear, finish ms, reaction ms, red light, perfect shifts) ~12 times a second, `hb`
 *     (heartbeat) once a second, `rdy` (Play again) and `n`/`c` (name, color). There are no
 *     intents: nothing you do changes anyone else's car. Times are measured in each browser.
 *   - Other cars are drawn from their last snapshot pushed on by their speed, then eased.
 *   - Someone who arrives mid-race watches it and lines up for the next one.
 *   - ?attract plays offline: your car drives itself against bots on a shorter strip.
 *   - Leaderboard "best-time": your fastest run (sent as 60000 - ms, so higher is better).
 */

// ── CONFIG ──────────────────────────────────────────────────────────────────────────
const CONFIG = {
  seats: 6,              // lanes; bots fill the ones nobody is in
  dist: 400,             // strip length in meters (a quarter mile is 402)
  stageMs: 4500,         // ms from a new race to green; the three ambers light in the last 1.5s
  amberMs: 500,          // ms between the amber lights
  raceMs: 22000,         // longest a race can last after green
  afterFirst: 6000,      // ms the others get once the first car is home
  resultsMs: 9000,       // ms on the results card before the next race
  gears: [13.4, 28.7, 41.6, 52, 60.9, 88.3], // each gear's top speed in m/s: the limiter
  grip: 13,              // m/s², the most the tires can push (the launch)
  power: 340,            // engine power: once the tires grip, push = power / speed
  drag: 0.0006,          // air drag
  greenLo: 0.85,         // the green shift zone starts here (share of the limiter rpm)...
  greenHi: 0.97,         // ...and ends here; above it a shift is late
  kick: 0.6,             // m/s a perfect shift adds at once
  boost: 1.15,           // extra push for a moment after a perfect shift...
  boostMs: 400,          // ...this long
  limiterDecel: 5,       // m/s² you lose while bouncing on the limiter (shift sooner!)
  chuteDecel: 9,         // m/s² the parachute brakes with past the line
  redLightMs: 700,       // penalty for launching before green
  botReact: [170, 450],  // best and worst bot reaction, ms
  botSkill: [0.2, 0.75], // 0..1: how often the bots shift in the green zone (a sharp human beats 0.75)
  sendMs: 80,            // how often your car goes out (~12/s)
  redline: 9000,         // what the dial shows at the limiter
  board: "best-time",
};
const BOT_NAMES = ["Torque", "Nitro", "Clutch", "Piston", "Diesel", "Sparky", "Revvy", "Boost"];
const COLORS = ["#ff3b6b", "#3fa7ff", "#ffd23f", "#4ee08a", "#b26bff", "#ff8c42", "#ff6fd8", "#3fe0c5"];
const GO = "#3dff8a", GOLD = "#ffd23f", BAD = "#ff3b6b", LATE = "#ff9f3f", DIM = "#a9a3cc";

// ── CONNECTION ──────────────────────────────────────────────────────────────────────
// The builder fills these in for this game. Downloaded from GitHub? Put your own pk_ key here.
const MP_CONNECT = {
  key: 'pk_REPLACE_ME',
  room: 'drag-tap',
  endpoint: 'wss://live.multiplayeragent.com',
  apiUrl: 'https://api.multiplayeragent.com',
};
const ATTRACT = new URLSearchParams(location.search).has("attract");

/** Same shape as the SDK client, kept in this tab: offline play and ?attract. */
function localRoom() {
  const id = "local", state = { entities: { players: { [id]: {} } }, shared: {} }, subs = [];
  let queued = false;
  const emit = () => { if (!queued) { queued = true; queueMicrotask(() => { queued = false; subs.forEach((f) => f(state)); }); } };
  const put = (o, k, v) => { if (typeof k === "object") Object.assign(o, k); else o[k] = v; emit(); };
  return {
    sessionId: id, state, offline: true,
    me: { set: (k, v) => put(state.entities.players[id], k, v) },
    setShared: (k, v) => put(state.shared, k, v),
    onState: (f) => { subs.push(f); f(state); }, onJoin() {}, onLeave() {}, on() {}, send() {},
    onDisconnect() {}, onReconnect() {}, leave: async () => {},
  };
}
async function connect() {
  if (ATTRACT || typeof MP === "undefined") return localRoom();
  try {
    const mp = await Promise.race([MP.join({ ...MP_CONNECT }), new Promise((_, no) => setTimeout(() => no(new Error("timed out")), 10000))]);
    window.mp = mp; // the builder calls window.mp.leave() when the page closes
    return mp;
  } catch (e) {
    console.warn("Playing offline:", e && e.message);
    return localRoom();
  }
}
const parse = (v, fb) => { if (typeof v !== "string") return fb; try { return JSON.parse(v); } catch { return fb; } };
const memo = new Map();
/** A JSON field, parsed once per change (read-only: never mutate what this returns). */
function cached(key, raw, fb) { const m = memo.get(key); if (m && m.raw === raw) return m.v; const v = parse(raw, fb); memo.set(key, { raw, v }); return v; }
let net = null, S = { entities: { players: {} }, shared: {} }, netDown = false;
const seenHb = new Map(); // sessionId -> { hb, at } on OUR clock
/** Players whose heartbeat moved in the last 3s (plus us), sorted by sessionId. */
function livePlayers() {
  const now = performance.now(), out = [];
  for (const [id, p] of Object.entries(S.entities.players || {})) {
    const s = seenHb.get(id);
    if (!s || s.hb !== p.hb) seenHb.set(id, { hb: p.hb, at: now });
    if (id === net.sessionId || now - seenHb.get(id).at < 3000) out.push(id);
  }
  return out.sort();
}
const isHost = () => livePlayers()[0] === net.sessionId;
const humans = () => livePlayers(); // (in ?attract your own car races too, driven by the autopilot)

// ── CAR ─────────────────────────────────────────────────────────────────────────────
// x = meters from the start line to the front bumper, v = m/s, g = gear (0 = first),
// clock = ms since green on this car's own clock, f = finish time in ms (penalty included).
const newCar = () => ({ x: 0, v: 0, g: 0, clock: 0, f: 0, p: 0, lim: 0, onLim: false, boostUntil: 0, launched: false, rt: -1, rl: 0 });
const rpmOf = (c) => c.v / CONFIG.gears[c.g];
/** How much of the engine's push you get at this rpm: a car bogs down after an early shift. */
const band = (rpm) => 0.3 + 0.7 * Math.min(1, rpm / 0.8);
function launch(c, rt, redLight) { c.launched = true; c.rt = Math.round(rt); c.clock = rt; if (redLight) c.rl = 1; }
/** Moves a car on by dt seconds, in small steps so every frame rate gives the same times. */
function stepCar(c, dt) {
  if (!c.launched) return;
  for (let left = dt; left > 1e-9; left -= 1 / 240) {
    const h = Math.min(left, 1 / 240);
    if (c.f) { c.v = Math.max(0, c.v - CONFIG.chuteDecel * h); c.x += c.v * h; continue; } // past the line: parachute
    const top = CONFIG.gears[c.g], rpm = c.v / top;
    if (rpm >= 0.999) c.onLim = true; else if (rpm < 0.97) c.onLim = false; // the limiter cuts in, and back out
    let a = c.onLim ? -CONFIG.limiterDecel : Math.min(CONFIG.grip, CONFIG.power / Math.max(1, c.v)) * band(rpm) * (c.clock < c.boostUntil ? CONFIG.boost : 1);
    if (c.onLim) c.lim += h;
    a -= CONFIG.drag * c.v * c.v;
    c.v = Math.max(0, Math.min(top, c.v + a * h));
    const x0 = c.x; c.x += c.v * h; c.clock += h * 1000;
    if (c.x >= CONFIG.dist && x0 < CONFIG.dist) c.f = Math.round(c.clock - (h * 1000 * (c.x - CONFIG.dist)) / Math.max(1e-6, c.x - x0)) + (c.rl ? CONFIG.redLightMs : 0);
  }
}
/** One gear up. Returns "perfect" (in the green zone: a kick and a boost), "early", "late" or "" (top gear). */
function shiftUp(c) {
  if (c.g >= CONFIG.gears.length - 1 || c.f) return "";
  const rpm = rpmOf(c);
  c.g++; c.onLim = false; c.lim = 0;
  if (rpm >= CONFIG.greenLo && rpm < CONFIG.greenHi) { c.v += CONFIG.kick; c.boostUntil = c.clock + CONFIG.boostMs; c.p++; return "perfect"; }
  return rpm < CONFIG.greenLo ? "early" : "late";
}

// ── RACE (HOST) ─────────────────────────────────────────────────────────────────────
const host = { last: null, wasHost: false, bots: [], raceId: 0, lastBots: 0 };
/** The race as state has it, or the host's own newer write that hasn't come back yet. `v` only goes up. */
function race() {
  const r = cached("race", S.shared.race, null);
  return host.last && isHost() && (!r || host.last.v > r.v) ? host.last : r;
}
function writeRace(r) { r = { ...r, v: (race()?.v ?? 0) + 1 }; host.last = r; net.setShared("race", JSON.stringify(r)); return r; }
const newRace = (id) => ({ id, phase: "stage", greenAt: Date.now() + CONFIG.stageMs, endsAt: 0, lanes: [], res: [] });

/** A bot: its reaction and, for each gear, where it will shift (over 1 = it sits on the limiter that long). */
function makeBot(id, name, color, skill) {
  const miss = 1 - skill, [fast, slow] = CONFIG.botReact;
  const bot = { id, name, color, skill, car: newCar(), react: (slow - (slow - fast) * skill) * (0.8 + Math.random() * 0.4), jump: Math.random() < 0.03, plan: [] };
  for (let g = 0; g < CONFIG.gears.length - 1; g++) {
    const roll = Math.random();
    bot.plan.push(roll < miss * 0.45 ? 0.68 + Math.random() * 0.14 : roll < miss * 0.65 ? 1.05 + Math.random() * 0.25 : 0.91 + (Math.random() - 0.5) * 0.3 * miss);
  }
  return bot;
}
/** Become host: take over the bots exactly as state has them (fresh plans, same cars). */
function adopt() {
  host.wasHost = true;
  const r = race(), sb = cached("bots", S.shared.bots, null);
  host.raceId = r ? r.id : 0;
  host.bots = r && sb && sb.r === r.id && Array.isArray(sb.list) ? sb.list.map((b) => {
    const bot = makeBot(b.i, b.n, b.c, b.s);
    Object.assign(bot.car, { x: b.x, v: b.v, g: b.g, f: b.f, p: b.p, rt: b.rt, rl: b.rl, launched: b.rt >= 0, clock: b.k ?? Math.max(0, Date.now() - r.greenAt) }); // driveBots catches it up
    if (bot.car.launched || b.rl) bot.jump = false;
    return bot;
  }) : [];
}
function fillBots() {
  const want = Math.max(0, CONFIG.seats - humans().length);
  if (host.bots.length > want) host.bots.length = want;
  const taken = new Set([...Object.values(S.entities.players || {}).map((p) => p.c), myColor]);
  while (host.bots.length < want) {
    const i = host.bots.length, names = new Set(host.bots.map((b) => b.name)), colors = new Set([...taken, ...host.bots.map((b) => b.color)]);
    const [lo, hi] = CONFIG.botSkill;
    host.bots.push(makeBot("bot" + i, BOT_NAMES.find((n) => !names.has(n)) || "Bot", COLORS.find((c) => !colors.has(c)) || "#ccc", lo + (hi - lo) * Math.random()));
  }
}
/** The host drives every bot: launch after its reaction, shift where its plan says. Each bot's clock is
 *  caught up with real time, so a slow frame (or a host that took over late) never slows the bots down. */
function driveBots(r, t) {
  for (const b of host.bots) {
    const c = b.car;
    if (!c.launched) {
      if (b.jump) launch(c, 0, true); // jumped the start: rolls at green, with the penalty
      else if (t >= r.greenAt + b.react) launch(c, b.react, false);
      else continue;
    }
    for (let left = Math.min(30, (t - r.greenAt - c.clock) / 1000); left > 1e-6; left -= 1 / 60) {
      const want = b.plan[c.g];
      if (want !== undefined && !c.f && (want < 1 ? rpmOf(c) >= want : c.lim >= want - 1)) shiftUp(c);
      stepCar(c, Math.min(left, 1 / 60));
    }
  }
}
/** Bots as everyone sees them: the host's live cars, or the last snapshot it wrote. */
function botList() {
  const r = race();
  if (!isHost()) { const sb = cached("bots", S.shared.bots, null); return sb && r && sb.r === r.id && Array.isArray(sb.list) ? sb.list : []; }
  return host.bots.map((b) => ({ i: b.id, n: b.name, c: b.color, s: b.skill, x: b.car.x, v: b.car.v, g: b.car.g, f: b.car.f, rt: b.car.rt, rl: b.car.rl, p: b.car.p, k: b.car.clock }));
}
const r1 = (n) => Math.round(n * 10) / 10;
const botColors = () => (race() ? botList().map((b) => b.c) : []);
function writeBots(r) {
  const list = botList().map((b) => ({ ...b, s: r1(b.s), x: r1(b.x), v: r1(b.v), k: Math.round(b.k) }));
  net.setShared("bots", JSON.stringify({ r: r.id, list }));
}
/** A human's car for this race, from its entity (or null). */
function carOf(id, r) { const d = cached("d:" + id, (S.entities.players[id] || {}).d, null); return d && d.r === r.id ? d : null; }
/** Everyone in this race, in lane order: { id, lane, name, color, x, v, g, f, rt, rl, p, mine, bot, exact }. */
function racers(r) {
  const bots = new Map(botList().map((b) => [b.i, b])), live = new Set(humans());
  const inRace = (id) => (id === net.sessionId ? me.raceId === r.id : !!carOf(id, r));
  const ids = r.phase === "stage" ? [...[...live].filter(inRace), ...bots.keys()] : [...(r.lanes || [])];
  if (r.phase !== "stage") for (const id of live) if (!ids.includes(id) && inRace(id)) ids.push(id); // lined up in the last moment
  const out = [];
  ids.forEach((id, lane) => {
    const b = bots.get(id);
    if (b) return void out.push({ id, lane, name: b.n, color: b.c, x: b.x, v: b.v, g: b.g, f: b.f, rt: b.rt, rl: b.rl, p: b.p, bot: true, exact: isHost() });
    if (id === net.sessionId) { if (me.raceId === r.id) out.push({ id, lane, name: myName, color: myColor, ...me.car, mine: true, exact: true }); return; }
    const p = S.entities.players[id], d = p && live.has(id) && carOf(id, r); // a player whose tab went quiet drops out
    if (d) out.push({ id, lane, name: String(p.n || "Player"), color: p.c || "#ccc", x: d.x, v: d.v, g: d.g, f: d.f, rt: d.rt, rl: d.rl, p: d.p });
  });
  out.lanes = ids.length;
  return out;
}
/** Finished cars by time (penalties in), then the rest by how far they got. */
const ranked = (list) => [...list].sort((a, b) => (a.f && b.f ? a.f - b.f : a.f ? -1 : b.f ? 1 : b.x - a.x));

function hostTick(now) {
  if (!host.wasHost) adopt();
  let r = race();
  const t = Date.now();
  if (!r) r = writeRace(newRace(1));
  if (host.raceId !== r.id) { host.raceId = r.id; host.bots = []; } // a new race: fresh bots
  if (r.phase === "stage") {
    if (t < r.greenAt - CONFIG.amberMs * 3 || !host.bots.length) fillBots(); // lanes can change until the ambers light
    if (t >= r.greenAt) r = writeRace({ ...r, phase: "race", endsAt: r.greenAt + CONFIG.raceMs, lanes: racers(r).map((x) => x.id) });
  }
  if (t >= r.greenAt) driveBots(r, t);
  if (r.phase === "race") {
    const all = racers(r), home = all.filter((x) => x.f);
    if (home.length && r.endsAt > t + CONFIG.afterFirst) r = writeRace({ ...r, endsAt: t + CONFIG.afterFirst });
    if ((all.length && home.length === all.length) || t > r.endsAt) {
      const res = ranked(all).slice(0, 10).map((x) => [x.id, String(x.name).slice(0, 14), x.color, x.f, x.rt, x.p, Math.round(x.x), x.rl]);
      r = writeRace({ ...r, phase: "done", endsAt: t + CONFIG.resultsMs, res });
    }
  } else if (r.phase === "done") {
    const people = humans(), ready = people.length && people.every((id) => (id === net.sessionId ? me.ready : (S.entities.players[id] || {}).rdy) === r.id);
    if (t > r.endsAt || ready) r = writeRace(newRace(r.id + 1));
  }
  if (now - host.lastBots > (r.phase === "race" ? 100 : 400)) { host.lastBots = now; writeBots(r); }
}

// ── MY CAR ──────────────────────────────────────────────────────────────────────────
let myName = "";
try { myName = localStorage.getItem("mpa-name") || ""; } catch {}
myName = myName || ["Rapid", "Rocket", "Slick", "Turbo", "Thunder", "Lucky"][Math.floor(Math.random() * 6)] + " " + ["Racer", "Driver", "Wheels", "Pilot", "Rider"][Math.floor(Math.random() * 5)];
let myColor = COLORS[0]; // picked on join: the first color nobody in the room has
const me = { raceId: -1, car: newCar(), grades: [], jumped: false, best: 0, ready: 0, submitted: -1, lastSend: 0, lastJson: "", autoReact: 150, autoShift: 0.9 };

/** The one button: launch on green (before it = red light), then shift up.
 *  `at` = when the press happened (the input event's timestamp), read before anything slow runs. */
function act(at) {
  if (!(at > 0 && at <= performance.now())) at = performance.now();
  const wall = Date.now() - (performance.now() - at);
  unlockAudio(); // the first call builds the engine sound, which can take a moment: the press time is already stamped
  const r = race();
  if (!r) return;
  if (r.phase === "done") return void playAgain();
  if (me.raceId !== r.id) return;
  const c = me.car, tg = wall - r.greenAt;
  if (!c.launched) {
    if (me.jumped) return;
    if (tg < -CONFIG.amberMs * 3) return void popup("Wait for the lights", DIM);
    if (tg < 0) { me.jumped = true; c.rl = 1; popup(`RED LIGHT +${(CONFIG.redLightMs / 1000).toFixed(1)}s`, BAD, true); sfx("red"); shake(6); publish(true); return; }
    launch(c, tg, false);

    if (on || red) { ctx.shadowColor = col; ctx.shadowBlur = b * 1.4; }
    ctx.fillStyle = on || red ? col : "#2a2840"; ctx.beginPath(); ctx.arc(cx, cy, b, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
    ctx.fillStyle = "#ffffff2a"; ctx.beginPath(); ctx.arc(cx - b * 0.3, cy - b * 0.3, b * 0.35, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/** The dashboard: shift lights, the rev dial with its green zone, gear, speed, time. */
function drawDash(r, list, now) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const top = L.dashTop, bottom = L.dashBottom;
  const bg = ctx.createLinearGradient(0, top, 0, H); bg.addColorStop(0, "#141230"); bg.addColorStop(1, "#0b0a1c");
  ctx.fillStyle = bg; ctx.fillRect(0, top, W, H - top);
  ctx.fillStyle = "#ff3b6b"; ctx.fillRect(0, top, W, 2);
  const mine = list.find((x) => x.mine), lead = ranked(list)[0], car = mine || lead || { v: 0, g: 0, x: 0 };
  const tg = Date.now() - r.greenAt, live = mine && me.car.launched && !me.car.f;
  let rpm = car.v / CONFIG.gears[car.g || 0];
  if (mine && !me.car.launched) rpm = tg > -CONFIG.amberMs * 3 ? 0.42 + Math.sin(now / 60) * 0.03 : 0.12 + Math.sin(now / 90) * 0.01; // revving on the line
  if (mine && me.car.f) rpm = Math.max(0.1, rpm);
  dash.needle += (rpm - dash.needle) * 0.35;
  const stats = L.portrait ? 50 : 0, ledY = top + 30 + stats, avail = bottom - ledY - 22;
  const R = Math.max(40, Math.min(avail / 1.85, L.portrait ? W * 0.36 : W * 0.16, 160)), cx = W / 2, cy = ledY + 22 + R;
  // shift lights: fill up as the revs climb, all green in the zone, red past it
  const zone = rpm >= CONFIG.greenLo && rpm < CONFIG.greenHi, over = rpm >= CONFIG.greenHi, nLed = 11, ledW = Math.max(R * 2.1, 180) / nLed;
  for (let i = 0; i < nLed; i++) {
    const at = 0.5 + (i / (nLed - 1)) * (CONFIG.greenLo - 0.5), on = rpm >= at;
    const col = over ? (Math.floor(now / 70) % 2 ? BAD : "#5a1020") : zone ? GO : on ? (i < 4 ? "#3fa7ff" : i < 8 ? GOLD : LATE) : "#24223a";
    if ((zone || over) && on) { ctx.shadowColor = col; ctx.shadowBlur = 10; }
    ctx.fillStyle = col; round(cx - (ledW * nLed) / 2 + i * ledW + 2, ledY, ledW - 4, 10, 4); ctx.fill(); ctx.shadowBlur = 0;
  }
  // dial
  const A0 = Math.PI * 0.75, SWEEP = Math.PI * 1.5, MAXF = 1.12, ang = (f) => A0 + (Math.min(MAXF, Math.max(0, f)) / MAXF) * SWEEP;
  ctx.fillStyle = "#0b0a1c"; ctx.beginPath(); ctx.arc(cx, cy, R + 8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = zone && live ? GO : "#ffffff26"; ctx.lineWidth = zone && live ? 3 : 2; ctx.stroke();
  const face = ctx.createRadialGradient(cx, cy - R * 0.3, R * 0.1, cx, cy, R); face.addColorStop(0, "#232046"); face.addColorStop(1, "#14122c");
  ctx.fillStyle = face; ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fill();
  const arc = (f0, f1, col, wid) => { ctx.strokeStyle = col; ctx.lineWidth = wid; ctx.beginPath(); ctx.arc(cx, cy, R * 0.86, ang(f0), ang(f1)); ctx.stroke(); };
  arc(0, CONFIG.greenLo, "#ffffff14", R * 0.1);
  if (zone && live) { ctx.shadowColor = GO; ctx.shadowBlur = 18; }
  arc(CONFIG.greenLo, CONFIG.greenHi, GO, R * 0.16); ctx.shadowBlur = 0;
  arc(CONFIG.greenHi, 1, LATE, R * 0.12); arc(1, MAXF, BAD, R * 0.12);
  ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillStyle = "#f4f1ff"; ctx.strokeStyle = "#f4f1ffaa";
  const steps = Math.ceil((CONFIG.redline * MAXF) / 1000);
  for (let i = 0; i <= steps; i++) {
    const a = ang((i * 1000) / CONFIG.redline); if ((i * 1000) / CONFIG.redline > MAXF) break;
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx + Math.cos(a) * R * 0.72, cy + Math.sin(a) * R * 0.72); ctx.lineTo(cx + Math.cos(a) * R * 0.64, cy + Math.sin(a) * R * 0.64); ctx.stroke();
    ctx.font = `700 ${Math.max(10, Math.round(R * 0.11))}px system-ui, sans-serif`; ctx.fillText(String(i), cx + Math.cos(a) * R * 0.53, cy + Math.sin(a) * R * 0.53);
  }
  const na = ang(dash.needle); // needle
  ctx.strokeStyle = BAD; ctx.lineWidth = Math.max(3, R * 0.04); ctx.lineCap = "round"; ctx.shadowColor = BAD; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(cx - Math.cos(na) * R * 0.12, cy - Math.sin(na) * R * 0.12); ctx.lineTo(cx + Math.cos(na) * R * 0.9, cy + Math.sin(na) * R * 0.9); ctx.stroke();
  ctx.shadowBlur = 0; ctx.lineCap = "butt";
  ctx.fillStyle = "#2a2850"; ctx.beginPath(); ctx.arc(cx, cy, R * 0.1, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = zone && live ? GO : "#f4f1ff"; ctx.font = `900 ${Math.round(R * 0.42)}px system-ui, sans-serif`;
  ctx.fillText(String((car.g || 0) + 1), cx, cy + R * 0.46);
  ctx.fillStyle = DIM; ctx.font = `700 ${Math.max(10, Math.round(R * 0.11))}px system-ui, sans-serif`;
  ctx.fillText(`${Math.round((car.v || 0) * 3.6)} km/h`, cx, cy + R * 0.74);
  ctx.fillText("GEAR", cx, cy + R * 0.2);
  // your shifts this race, one square each: green perfect, yellow early, orange late
  const nShift = CONFIG.gears.length - 1, sq = Math.max(6, R * 0.07);
  for (let i = 0; i < nShift; i++) {
    const g = mine ? me.grades[i] : null;
    ctx.fillStyle = g === "perfect" ? GO : g === "early" ? GOLD : g === "late" ? LATE : "#ffffff22";
    ctx.fillRect(cx - (nShift * (sq + 4)) / 2 + i * (sq + 4) + 2, cy + R * 0.84, sq, sq);
  }
  // reaction, time, place and your best: in a row on phones, beside the dial on wide screens
  const place = mine ? ranked(list).indexOf(mine) + 1 : 0, clock = mine ? (me.car.launched ? me.car.f || me.car.clock : Math.max(0, tg)) : 0;
  const cells = [["REACTION", mine && me.car.rt >= 0 ? (me.car.rt / 1000).toFixed(3) : "-.---"], ["TIME", mine ? (clock / 1000).toFixed(2) : "--"],
    ["PLACE", place && me.car.launched ? `${ord(place)}/${list.length}` : "-"], ["BEST", me.best ? (me.best / 1000).toFixed(3) : "-.---"]];
  ctx.textBaseline = "alphabetic"; ctx.textAlign = "center";
  const side = Math.min(150, (W / 2 - R) * 0.6);
  cells.forEach(([label, val], i) => {
    const x = L.portrait ? W / 2 + (i - 1.5) * Math.min(120, W * 0.245) : cx + (i < 2 ? -1 : 1) * (R + 22 + side / 2);
    const y = L.portrait ? top + 34 : cy - R * 0.45 + (i % 2) * Math.max(56, R * 0.75);
    ctx.fillStyle = DIM; ctx.font = "700 11px system-ui, sans-serif"; ctx.fillText(label, x, y);
    ctx.fillStyle = i === 0 && mine && me.car.rt >= 0 ? (me.car.rt < 200 ? GO : me.car.rt < 350 ? GOLD : LATE) : i === 3 ? GOLD : "#f4f1ff";
    ctx.font = `800 ${L.portrait ? 19 : 24}px ui-monospace, Menlo, Consolas, monospace`; ctx.fillText(val, x, y + (L.portrait ? 22 : 27));
  });
}
const dash = { needle: 0.1 };
const pops = [];
const popup = (text, color, big) => { pops.push({ text, color, big, at: performance.now() }); if (pops.length > 3) pops.shift(); };

// ── HUD & RESULTS ───────────────────────────────────────────────────────────────────
const ord = (n) => n + (n % 10 === 1 && n % 100 !== 11 ? "st" : n % 10 === 2 && n % 100 !== 12 ? "nd" : n % 10 === 3 && n % 100 !== 13 ? "rd" : "th");
const secs = (ms) => (ms / 1000).toFixed(3) + "s";
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let board = null, boardFor = -1;
function hud(r, list) {
  const t = Date.now(), tg = t - r.greenAt, racing = me.raceId === r.id, c = me.car;
  const btn = $("act");
  btn.hidden = !touchUI || ATTRACT || r.phase === "done";
  btn.textContent = !racing ? "WATCHING" : !c.launched ? (me.jumped ? "RED LIGHT" : "LAUNCH") : c.f ? "HOME!" : "SHIFT";
  btn.classList.toggle("wait", !racing || (!c.launched && tg < 0));
  if (ATTRACT) { $("net").textContent = ""; $("status").textContent = ""; $("hint").textContent = ""; $("over").hidden = true; return; }
  const n = livePlayers().length;
  $("net").textContent = netDown ? "Reconnecting…" : net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the race" : ""}`;
  const tap = touchUI ? "Tap" : "Press Space or click";
  $("status").textContent = r.phase === "stage" ? (racing ? (tg < -CONFIG.amberMs * 3 ? `Race ${r.id} · line up` : "Get ready…") : "Next race soon")
    : r.phase === "race" ? (!racing ? "Race on: you're in the next one" : !c.launched && !me.jumped ? "GO! GO! GO!" : c.f ? `Home in ${secs(c.f)}` : "") : "Race over";
  $("hint").textContent = !racing || r.phase === "done" ? "" : !c.launched ? `${tap} on GREEN to launch. Not before!` : !c.f && me.grades.length < 2 ? `${tap} when the needle is in the GREEN zone to shift up` : "";
  $("over").hidden = r.phase !== "done";
  if (r.phase === "done") {
    const top = r.res[0];
    $("winner").textContent = !top ? "Race over" : top[0] === net.sessionId ? "You win!" : `${top[1]} wins!`;
    $("results").innerHTML = r.res.map(([id, name, color, f, rt, p, x, rl]) => `<li class="${id === net.sessionId ? "me" : ""}"><b style="color:${esc(color)}">●</b> ${esc(name)}<span>${f ? secs(f) : `${x} m`}</span>` +
      `<small>${rt >= 0 ? `reaction ${(rt / 1000).toFixed(3)}s` : "no launch"} · ${p}/${CONFIG.gears.length - 1} perfect${rl ? " · red light" : ""}</small></li>`).join("");
    $("again").textContent = me.ready === r.id ? "Waiting for the others…" : "Play again";
    $("next").textContent = `Next race in ${Math.max(0, Math.ceil((r.endsAt - t) / 1000))}s`;
    if (boardFor !== r.id) { boardFor = r.id; showBoard(r); }
  }
}
function showBoard(r) {
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  const mine = me.raceId === r.id && me.car.f && me.submitted !== r.id ? me.car.f : 0;
  me.submitted = r.id;
  (mine ? board.submit(Math.max(0, 60000 - mine)).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${secs(60000 - e.score)}</span></li>`).join("") : "<li>No times yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
function playAgain() { const r = race(); if (r && r.phase === "done") { me.ready = r.id; net.me.set("rdy", r.id); $("again").textContent = "Waiting for the others…"; } }
$("again").onclick = playAgain;

// Sounds, made on the fly with WebAudio (no files): an engine that follows your revs, plus beeps.
let audio = null, engine = null;
function unlockAudio() {
  if (audio || ATTRACT) return;
  try {
    audio = new AudioContext();
    const o1 = audio.createOscillator(), o2 = audio.createOscillator(), lp = audio.createBiquadFilter(), gain = audio.createGain();
    o1.type = "sawtooth"; o2.type = "square"; lp.type = "lowpass"; lp.frequency.value = 700; gain.gain.value = 0;
    o1.connect(lp); o2.connect(lp); lp.connect(gain).connect(audio.destination); o1.start(); o2.start();
    engine = { o1, o2, lp, gain };
  } catch { audio = null; }
}
function engineSound(r) {
  if (!engine) return;
  const c = me.car, racing = me.raceId === r.id && r.phase !== "done", t = audio.currentTime;
  const rpm = racing ? (c.launched ? rpmOf(c) : dash.needle) : 0.1, f = 34 + rpm * 120;
  engine.o1.frequency.setTargetAtTime(f, t, 0.02); engine.o2.frequency.setTargetAtTime(f / 2, t, 0.02);
  engine.lp.frequency.setTargetAtTime(400 + rpm * 1600, t, 0.05);
  const vol = !racing ? 0 : c.f ? 0.015 : c.onLim ? (Math.floor(performance.now() / 45) % 2 ? 0.07 : 0.02) : c.launched ? 0.06 : 0.035;
  engine.gain.gain.setTargetAtTime(vol, t, 0.04);
}
function sfx(kind) {
  if (!audio) return;
  const t = audio.currentTime, o = audio.createOscillator(), gain = audio.createGain();
  const [type, f0, f1, len, vol] = { amber: ["sine", 760, 760, 0.12, 0.2], green: ["sine", 1250, 1250, 0.35, 0.25], red: ["square", 180, 90, 0.5, 0.15], launch: ["sawtooth", 90, 260, 0.25, 0.12],
    perfect: ["triangle", 880, 1760, 0.18, 0.25], early: ["square", 260, 200, 0.1, 0.08], late: ["sawtooth", 160, 110, 0.18, 0.1], finish: ["triangle", 520, 1300, 0.5, 0.25] }[kind];
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + len);
  gain.gain.setValueAtTime(vol, t); gain.gain.exponentialRampToValueAtTime(0.001, t + len);
  o.connect(gain).connect(audio.destination); o.start(t); o.stop(t + len + 0.02);
}

// ── INPUT ───────────────────────────────────────────────────────────────────────────
document.body.classList.toggle("touch", touchUI);
addEventListener("keydown", (e) => { if (e.repeat) return; if ([" ", "Enter", "ArrowUp", "w", "W"].includes(e.key)) { e.preventDefault(); act(e.timeStamp); } });
cv.addEventListener("pointerdown", (e) => { e.preventDefault(); act(e.timeStamp); });
const actBtn = $("act");
actBtn.addEventListener("pointerdown", (e) => { e.preventDefault(); actBtn.classList.add("down"); act(e.timeStamp); });
for (const ev of ["pointerup", "pointercancel", "pointerleave"]) actBtn.addEventListener(ev, () => actBtn.classList.remove("down"));
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0;
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(now); else host.wasHost = false;
  const r = race();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (r) {
    if (viewsFor !== r.id) { viewsFor = r.id; views.clear(); parts.length = 0; }
    myTick(r, dt);
    const list = racers(r);
    drawScene(r, list, now, dt);
    drawTree(r, now);
    drawDash(r, list, now);
    engineSound(r);
    if (now - lastHud > 100) { lastHud = now; hud(r, list); }
  } else { ctx.fillStyle = "#0b0a1c"; ctx.fillRect(0, 0, W, H); }
  requestAnimationFrame(frame);
}
/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. */
function fixColor() {
  const others = Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId), bots = botColors();
  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !bots.includes(myColor)) return; // a bot in your color: you change
  const taken = new Set([...others.map(([, p]) => p.c), ...bots]), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); }
}

(async function start() {
  fit();
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors()]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) Object.assign(CONFIG, { dist: 240, stageMs: 1800, resultsMs: 1500, afterFirst: 1500, botSkill: [0.6, 0.95], botReact: [120, 260] });
  fit();
  requestAnimationFrame(frame);
})();
</script>
